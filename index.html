<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sport Planner</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM (UMD for local file support) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <section id="auth-screen" class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
            <h1 class="text-2xl font-bold text-gray-900">Sport Planner</h1>
            <p class="mt-2 text-sm text-gray-600">Log in om je trainingsgegevens te bekijken en op te slaan.</p>
            <form id="auth-form" class="mt-6 space-y-4">
                <label class="block text-sm font-medium text-gray-700">
                    E-mailadres
                    <input id="auth-email" type="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <label class="block text-sm font-medium text-gray-700">
                    Wachtwoord
                    <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <p id="auth-message" role="status" class="hidden text-sm text-red-600"></p>
                <button id="auth-submit" type="submit" class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">Inloggen</button>
            </form>
            <p class="mt-5 text-center text-sm text-gray-600">
                <span id="auth-mode-prompt">Nog geen account?</span>
                <button id="auth-mode-toggle" type="button" class="font-semibold text-blue-700 hover:underline">Account maken</button>
            </p>
        </div>
    </section>
    <section id="cloud-error" class="hidden min-h-screen items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-red-200 p-8">
            <h1 class="text-xl font-bold text-gray-900">Gegevens laden mislukt</h1>
            <p id="cloud-error-message" role="alert" class="mt-3 text-sm text-red-700"></p>
            <div class="mt-6 flex gap-3">
                <button id="cloud-retry" type="button" class="flex-1 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700">Opnieuw proberen</button>
                <button id="cloud-error-signout" type="button" class="rounded-lg border border-gray-300 px-4 py-2 font-semibold text-gray-700 hover:bg-gray-50">Uitloggen</button>
            </div>
        </div>
    </section>
    <div id="account-bar" class="hidden fixed right-4 top-4 z-50 items-center gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2 shadow-sm">
        <span id="sync-status" role="status" class="text-xs text-gray-600"></span>
        <button id="signout-button" type="button" class="text-sm font-semibold text-blue-700 hover:underline">Uitloggen</button>
    </div>
    <div id="root" class="hidden"></div>

    <!-- Load modules in order -->
    <script type="text/babel" src="js/constants.js"></script>
    <script type="text/babel" src="js/utils.js"></script>
    <script type="text/babel" src="js/icons.js"></script>
    <script type="text/babel" src="js/components/selectors.js"></script>
    <script type="text/babel" src="js/components/modals.js"></script>
    <script type="text/babel" src="js/components/sessions.js"></script>
    <script type="text/babel" src="js/components/dayCard.js"></script>
    <script type="text/babel" src="js/components/inputScreens.js"></script>
    <script type="text/babel" src="js/components/monthlyView.js"></script>
    <script type="text/babel" src="js/app.js"></script>
    
    <!-- Main entry point -->
    <script type="text/babel">
        const SUPABASE_URL = 'https://vmorvioojcuouvoendqg.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_3FRJvjy6lXIqySTiHi6BMA_M_YSh4wQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const appRootElement = document.getElementById('root');
        const appRoot = ReactDOM.createRoot(appRootElement);
        const authScreen = document.getElementById('auth-screen');
        const cloudError = document.getElementById('cloud-error');
        const accountBar = document.getElementById('account-bar');
        const authForm = document.getElementById('auth-form');
        const authMessage = document.getElementById('auth-message');
        const syncStatus = document.getElementById('sync-status');
        let isSignUpMode = false;
        let activeUserId = null;
        let loadedUserId = null;
        let authGeneration = 0;
        let currentSession = null;
        let saveTimer = null;
        let appStarted = false;
        let cloudWritesEnabled = false;

        const appDataKeys = {
            workoutDB: 'workout_db_v1',
            fitnessData: 'fitness_data_v1',
            weekMetadata: 'week_metadata_v1'
        };

        function setAuthMessage(message, isError = true) {
            authMessage.textContent = message;
            authMessage.classList.toggle('hidden', !message);
            authMessage.classList.toggle('text-red-600', isError);
            authMessage.classList.toggle('text-green-700', !isError);
        }

        function setCloudError(message) {
            document.getElementById('cloud-error-message').textContent = message;
            authScreen.classList.add('hidden');
            accountBar.classList.add('hidden');
            cloudError.classList.remove('hidden');
            cloudError.classList.add('flex');
        }

        function setSyncStatus(message, isError = false) {
            syncStatus.textContent = message;
            syncStatus.classList.toggle('text-red-600', isError);
            syncStatus.classList.toggle('text-gray-600', !isError);
        }

        function hydrateLocalData(data) {
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
                throw new Error('De opgeslagen gegevens hebben een ongeldig formaat.');
            }
            Object.entries(appDataKeys).forEach(([property, key]) => {
                if (Object.prototype.hasOwnProperty.call(data, property)) {
                    localStorage.setItem(key, JSON.stringify(data[property]));
                } else {
                    localStorage.removeItem(key);
                }
            });
        }

        function collectLocalData() {
            const data = {};
            Object.entries(appDataKeys).forEach(([property, key]) => {
                const value = localStorage.getItem(key);
                if (value !== null) data[property] = JSON.parse(value);
            });
            return data;
        }

        function scheduleCloudSave() {
            if (!cloudWritesEnabled || !activeUserId) return;
            clearTimeout(saveTimer);
            setSyncStatus('Opslaan…');
            saveTimer = setTimeout(async () => {
                const userId = activeUserId;
                try {
                    const { error } = await supabaseClient
                        .from('App_data')
                        .upsert({ user_id: userId, data: JSON.stringify(collectLocalData()) }, { onConflict: 'user_id' });
                    if (error) throw error;
                    if (activeUserId === userId) setSyncStatus('Opgeslagen');
                } catch (error) {
                    console.error('Supabase save failed', error);
                    if (activeUserId === userId) setSyncStatus(`Opslaan mislukt: ${error.message}`, true);
                }
            }, 500);
        }

        const originalSetItem = Storage.prototype.setItem;
        Storage.prototype.setItem = function(key, value) {
            originalSetItem.call(this, key, value);
            if (this === window.localStorage && Object.values(appDataKeys).includes(key)) scheduleCloudSave();
        };

        function waitForModules() {
            if (!activeUserId) return;
            if (window.SportPlanner &&
                window.SportPlanner.App &&
                window.SportPlanner.Constants &&
                window.SportPlanner.Utils &&
                window.SportPlanner.Icons &&
                window.SportPlanner.Selectors &&
                window.SportPlanner.Modals &&
                window.SportPlanner.Sessions &&
                window.SportPlanner.DayCard &&
                window.SportPlanner.InputScreens &&
                window.SportPlanner.MonthlyView) {
                if (!appStarted) {
                    appStarted = true;
                    appRootElement.classList.remove('hidden');
                    try {
                        appRoot.render(<window.SportPlanner.App />);
                    } catch (error) {
                        console.error(error);
                        showErrorOverlay('Render Error', error.stack || String(error));
                    }
                }
            } else {
                setTimeout(waitForModules, 50);
            }
        }

        async function loadUserData(session, generation) {
            activeUserId = session.user.id;
            loadedUserId = null;
            cloudWritesEnabled = false;
            clearTimeout(saveTimer);
            appRootElement.classList.add('hidden');
            appRoot.render(null);
            appStarted = false;
            authScreen.classList.add('hidden');
            cloudError.classList.add('hidden');
            cloudError.classList.remove('flex');
            accountBar.classList.remove('hidden');
            accountBar.classList.add('flex');
            setSyncStatus('Gegevens laden…');

            try {
                const { data: row, error } = await supabaseClient
                    .from('App_data')
                    .select('data')
                    .eq('user_id', session.user.id)
                    .maybeSingle();
                if (error) throw error;
                if (generation !== authGeneration || activeUserId !== session.user.id) return;

                if (row && row.data !== null) {
                    const parsedData = JSON.parse(row.data);
                    hydrateLocalData(parsedData);
                } else {
                    hydrateLocalData({});
                }

                loadedUserId = session.user.id;
                cloudWritesEnabled = true;
                setSyncStatus('Verbonden');
                waitForModules();
            } catch (error) {
                console.error('Supabase load failed', error);
                if (generation === authGeneration && activeUserId === session.user.id) {
                    activeUserId = null;
                    setCloudError(`Kon App_data niet laden: ${error.message}`);
                }
            }
        }

        function handleAuthSession(session, forceReload = false) {
            currentSession = session;
            const userId = session?.user?.id;
            if (userId) {
                if (!forceReload && (loadedUserId === userId || activeUserId === userId)) return;
                const generation = ++authGeneration;
                loadUserData(session, generation);
                return;
            }

            ++authGeneration;
            activeUserId = null;
            loadedUserId = null;
            cloudWritesEnabled = false;
            clearTimeout(saveTimer);
            if (appStarted) appRoot.render(null);
            appStarted = false;
            appRootElement.classList.add('hidden');
            accountBar.classList.add('hidden');
            cloudError.classList.add('hidden');
            cloudError.classList.remove('flex');
            authScreen.classList.remove('hidden');
        }

        document.getElementById('auth-mode-toggle').addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-submit').textContent = isSignUpMode ? 'Account maken' : 'Inloggen';
            document.getElementById('auth-mode-prompt').textContent = isSignUpMode ? 'Al een account?' : 'Nog geen account?';
            document.getElementById('auth-mode-toggle').textContent = isSignUpMode ? 'Inloggen' : 'Account maken';
            document.getElementById('auth-password').autocomplete = isSignUpMode ? 'new-password' : 'current-password';
            setAuthMessage('');
        });

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('auth-submit');
            button.disabled = true;
            setAuthMessage('');
            try {
                const credentials = {
                    email: document.getElementById('auth-email').value.trim(),
                    password: document.getElementById('auth-password').value
                };
                const { data, error } = isSignUpMode
                    ? await supabaseClient.auth.signUp(credentials)
                    : await supabaseClient.auth.signInWithPassword(credentials);
                if (error) throw error;
                if (isSignUpMode && !data.session) {
                    setAuthMessage('Account aangemaakt. Bevestig je e-mailadres via de ontvangen e-mail en log daarna in.', false);
                }
            } catch (error) {
                setAuthMessage(error.message);
            } finally {
                button.disabled = false;
            }
        });

        async function signOut() {
            const { error } = await supabaseClient.auth.signOut();
            if (error) setAuthMessage(`Uitloggen mislukt: ${error.message}`);
        }

        document.getElementById('signout-button').addEventListener('click', signOut);
        document.getElementById('cloud-error-signout').addEventListener('click', signOut);
        document.getElementById('cloud-retry').addEventListener('click', () => {
            if (currentSession) handleAuthSession(currentSession, true);
        });

        supabaseClient.auth.onAuthStateChange((event, session) => {
            setTimeout(() => handleAuthSession(session), 0);
        });

        // Error overlay helpers (show runtime errors in page when JS throws)
        function showErrorOverlay(title, message) {
            try {
                let el = document.getElementById('__error_overlay');
                if (!el) {
                    el = document.createElement('div');
                    el.id = '__error_overlay';
                    el.style.position = 'fixed';
                    el.style.left = '12px';
                    el.style.right = '12px';
                    el.style.top = '12px';
                    el.style.zIndex = 99999;
                    el.style.background = 'rgba(255,255,255,0.98)';
                    el.style.color = '#1f2937';
                    el.style.border = '1px solid #ef4444';
                    el.style.padding = '12px';
                    el.style.borderRadius = '8px';
                    el.style.boxShadow = '0 6px 18px rgba(0,0,0,0.12)';
                    document.body.appendChild(el);
                }
                el.innerHTML = `<div style="font-weight:700;color:#b91c1c;margin-bottom:6px">${title}</div><div style="font-family:monospace;white-space:pre-wrap;font-size:12px">${message}</div>`;
            } catch (e) {
                console.error('Failed to show error overlay', e);
            }
        }

        window.onerror = function(message, source, lineno, colno, err) {
            console.error('Window error', message, err);
            showErrorOverlay('Runtime Error', `${message} \n${source}:${lineno}:${colno}\n${err && err.stack ? err.stack : ''}`);
        };
        window.addEventListener('unhandledrejection', (ev) => {
            console.error('Unhandled Rejection', ev.reason);
            showErrorOverlay('Unhandled Promise Rejection', `${ev.reason && ev.reason.stack ? ev.reason.stack : String(ev.reason)}`);
        });

    </script>
</body>
</html>
